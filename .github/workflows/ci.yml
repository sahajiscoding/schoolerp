name: CI\n\non:\n  push:\n    branches: [main]\n  pull_request:\n\njobs:\n  lint-and-typecheck:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: "18"\n          cache: "npm"\n      - run: npm ci\n      - run: npm run typecheck\n      - run: npm run lint\n      - name: Guard against public secrets\n        run: |\n          if grep -r "EXPO_PUBLIC_.*\\(SECRET\\|SERVICE\\|PRIVATE\\|JWT\\|POSTGRES\\|PASSWORD\\|TOKEN\\)" apps/ 2>/dev/null | grep -v "PUBLISHABLE_KEY\\|ANON_KEY"; then\n            echo "Found secret-like EXPO_PUBLIC_ var"\n            exit 1\n          fi\n          if grep -r "VITE_.*\\(SECRET\\|SERVICE\\|PRIVATE\\|JWT\\|POSTGRES\\|PASSWORD\\|TOKEN\\)" apps/ 2>/dev/null | grep -v "PUBLISHABLE_KEY\\|ANON_KEY"; then\n            echo "Found secret-like VITE_ var"\n            exit 1\n          fi\n      - name: Warn if PROJECT_STATUS not updated\n        run: |\n          if git diff --name-only HEAD~1 2>/dev/null | grep -E "^(apps|supabase)/" && ! git diff --name-only HEAD~1 2>/dev/null | grep -q "PROJECT_STATUS.md"; then\n            echo "::warning::Consider updating PROJECT_STATUS.md"\n          fi\n
